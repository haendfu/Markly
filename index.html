<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/markly.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markly</title>
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("markly:theme");
          if (saved === "light" || saved === "sepia" || saved === "dark" || saved === "midnight") {
            theme = saved;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
